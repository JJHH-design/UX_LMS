asp:()=>`<h2>담당 팀원</h2><p class="mu">과제를 받을 팀원을 선택해 주세요.</p>${li('김민지','디자인학과 · 24학번','<span class="tg">선택하기</span>',"S.am=true;back()")}${li('한지민 · 나','팀장 · 디자인학과 · 24학번','','')}`,

tdet:()=>`<span class="tg">${TS[S.task]}</span><h2>화면 통합</h2><p class="mu">한지민 (나) · 11.18 (수) 18:00 마감</p><h3>작업 내용</h3><p>과제 제출 화면과 사용성 테스트 결과를 통합해 주세요.</p>${S.task<2?`<button class="bt" onclick="S.task++;R();toast('상태를 변경했어요')">${S.task?'완료로 변경':'작업 시작'}</button>`:`<button class="bt" onclick="back()">팀 작업 보기</button>`}`,
memos:()=>`<p class="mu">나만 볼 수 있는 기록이에요.</p>${MEMOS.map((m,i)=>li(m[1],`UX 프로토타이핑 · ${m[3]}차시 · ${m[0]}`,m[2],`S.memo=${i};go('mem')`)).join('')}`,

shr:()=>`<h2>메모 공유</h2><div class="cd hi" style="cursor:default">${memoTxt(S.memo)}</div><p class="mu">선택한 메모와 강의 시점만 전달돼요.</p><h3>받는 사람</h3>${[S.tname+' · 팀 채팅','김민지 · 1:1 채팅'].map((n,i)=>`<div class="opt ${S.rc==i?'s':''}" onclick="S.rc=${i};R(1)">${n}</div>`).join('')}<button class="bt" onclick="S.room=S.rc?'mj':'team';MSG[S.room].push(['나','__memo',S.memo]);S.st=[];S.scr='chat';S.tab='com';R();toast('메모를 보냈어요')">메모 보내기</button>`,

const TT={grad:'복학생 안내',asg:'과제',det:'과제 상세',s1:'과제 제출 · 1단계',pick:'파일 선택',big:'파일 선택',upl:'과제 제출',s2:'과제 제출 · 2단계',prev:'파일 미리보기',s3:'과제 제출 · 3단계',done:'과제 제출 완료',crs:'수업',ply:'수업',quiz:'4주차 퀴즈',qres:'퀴즈 결과',sum:'핵심 요약',fin:'4주차 학습 완료',com:'소통',chat:'',tmi:'팀 프로젝트',tpick:'팀 구성하기',tinv:'팀 구성하기',tlead:'팀장 선출하기',tname:'팀 이름 정하기',tprj:'팀 프로젝트',team:'팀 작업 현황',asn:'과제 부여',asp:'담당 팀원',asc:'배정 내용 확인',asd:'배정한 과제',tdet:'팀 작업 상세',memos:'전체 메모',mem:'내 메모',shr:'메모 공유',more:'더보기'};
function ms(){const F=S.f,c=a=>a?'ok':'',fl=[['Main Flow','마감 기한이 얼마 남지 않은 과제가 있습니다. 제출을 완료해주세요.',[['파이널 프로토타입',F.det],['첨부파일 제출',F.att],['미리보기',F.prv],['제출 확인하기',S.sub]]],['Sub Flow 1','4주차 온라인 강의 수강 시간이 얼마 남지 않았습니다. 4주차 강의 학습을 전부 완료해 주세요.',[['강의 전부 듣기',S.les>=30],['퀴즈 풀기',S.qd],['간단 정리 확인',S.sd]]],['Sub Flow 2','당신이 Hello 디자인의 팀장이 되어 팀을 구성하고 과제를 부여해주세요.',[['김민지를 넣어 팀 만들기',S.tm>=1],['팀 과제 배정하기',S.tm==2]]],['Sub Flow 3','복학 후 처음 접속했습니다. 바뀐 학사 정보를 확인하고, 놓치면 안 되는 기한을 할 일에 추가해 주세요.',[['복학생 안내 확인',F.grad],['기한 확인',F.dl],['할 일에 추가',S.todo.length>0],['홈 오늘 할 일에서 확인',F.hm]]]];
$('ms').innerHTML=`<b style="font-size:16px">플로우 미션</b><p>각 Goal을 수행하면 Success가 체크돼요.</p>`+fl.map(f=>`<h4>${f[0]}</h4><p><b>Goal</b> ${f[1]}</p><ul>${f[2].map(s=>`<li class="${c(s[1])}">${s[1]?'✓':'○'} ${s[0]}</li>`).join('')}</ul>`).join('')+`<button class="bt sec" style="margin-top:12px" onclick="location.reload()">처음부터 다시</button>`}
function R(keep){const F=S.f;if(S.scr=='grad'){F.grad=1;if(S.gt=='기한')F.dl=1}if(S.scr=='home'&&S.todo.length)F.hm=1;if(S.scr=='det')F.det=1;if(S.scr=='s2')F.att=1;if(S.scr=='prev')F.prv=1;
const root=K.includes(S.scr),bk=!root&&S.scr!=='upl'?`<button onclick="back()">${ICO('back',24)}</button>`:'';
const ttl=S.scr=='ply'?S.ls+'차시 수업':S.scr=='chat'?(S.room=='team'?S.tname:'김민지'):TT[S.scr];
$('top').innerHTML=S.scr==='home'?`<span style="letter-spacing:.5px">HELLOLMS</span><button class="bell" onclick="toast('새 알림이 없어요')">${ICO('bell',20)}</button>`:bk+ttl;
const y=$('bd').scrollTop;(()=>{const b=$('bd');b.innerHTML='<div class="pg"><div class="cn">'+V[S.scr]()+'</div><div class="ft"></div></div>';const ft=b.querySelector('.ft');b.querySelectorAll('.cn .bt,.cn .ci').forEach(e=>ft.appendChild(e))})();$('bd').scrollTop=keep?y:(S.scr=='chat'?99999:0);
$('nav').innerHTML=T.map((t,i)=>`<button class="${K[i]==S.tab?'on':''}" onclick="tab('${K[i]}')">${ICO(K[i],22)}${t}</button>`).join('');$('md').innerHTML=MD()}
R();
</script></body></html>
